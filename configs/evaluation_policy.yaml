version: stage3_luna_validation_v1
primary_metrics: [cross_family_pairwise_judge, meaning_preservation_rate]
auxiliary_metrics: [kanana_smoothed_integer_n64, kanana_greedy, style_consistency, edit_amount, cost]
kanana:
  role: auxiliary
  method: integer_mean
  n: 64
  temperature: 1.0
  generation_batch_size: 8
  master_seed: 15042
  seed_scheme: sha256_essay_id_v1
  # Rule: int.from_bytes(SHA256(UTF8(f"15042:{essay_id}"))[:4], "big") % (2**31 - 1).
  # Use the original essay ID for original text, every condition and every repeat.
  # Same result assumes the same model/runtime, batch size and sampling settings.
  record_greedy: true
  conditional_expectation_average: false
decision:
  origin: user_approved_after_observing_stage1_5_results
  post_result_selection: true
  source_run: runs/20261014T124844.658852Z_fee9ddb861
  original_n32_primary_adoption_rule: failed
  original_rule_is_unchanged: true
  confirmatory_experiment: not_requested_and_not_run
  reasons:
    - Smoothing reduced the large LF and contraction sensitivity seen with a single greedy line.
    - Across 100 canonical originals, integer score block SD averaged 2.353 at N8, 1.583 at N16, and 1.016 at N32.
    - N64 uses all saved samples to reduce Monte Carlo error; its single block cannot provide a between-block SD.
    - N64 is an auxiliary choice made after results, not a retrospective pass of the original N32 primary rule.
judge:
  different_family_from_agent: true
  pairwise_orders: [whole_once_first, incremental_first]
  allow_tie: true
  agent_model: gpt-6-luna
  model_selection: cheapest_candidate_passing_all_three_gates_else_stop
  candidates: [claude-haiku-5-5, claude-sonnet-5-5]
  protocol: configs/stage3_protocol.yaml
  no_post_result_reasoning_retest: true
  pairwise_validation:
    label_source: human_original_scores_same_exact_prompt
    pairs: 20
    ordered_judgments: 40
    minimum_total_gap: 16
    threshold: 0.7
    ties: incorrect
    excludes: [pilots_10, calibration_100, stage5_evaluation]
    limitation: does_not_validate_revisions_of_the_same_essay
  controlled_semantic_validation:
    pairs: 80
    binary_kappa_minimum: 0.6
    label_source: deterministic_transform_rules
  human_agreement:
    required_in_stage: 3
    status: pending
    label_source: user_labels_of_blinded_actual_luna_and_historical_haiku_revisions
    sample_size: 50
    agreement_threshold: 0.6
    tasks: [binary_meaning_preservation_kappa]
    label_map: {보존: 보존, 경미한 뉘앙스 변화: 변화, 의미 변화: 변화}
    report: [cohen_kappa, cluster_bootstrap_95_ci, item_bootstrap_95_ci, confusion_matrix, disagreement_examples]
    freeze_sample_and_rules_before_judge_results: true
    completion_requires_actual_human_labels: true
live_calls:
  estimate_call_count_and_cost_first: true
  explicit_user_approval_required: true
