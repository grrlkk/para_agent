# Historical stage-1.5 protocol (N32). Current evaluation uses evaluation_policy.yaml.
schema_version: 1
seed:
  scheme: sha256_essay_id_v1
  master_seed: 15042
  hash_input: "{master_seed}:{essay_id}"
  encoding: utf-8
  digest_prefix_bytes: 4
  byte_order: big
  modulus: 2147483647
  scope: Same original essay ID for its original, every variant, and every revision condition.
  exclude_from_seed: [text, prompt, condition, execution_order, repetition]
  reproducibility: Fixed model, LoRA, tokenizer, numerical backend, device policy, batch size, and sampling settings are required.
sampling:
  max_n: 64
  primary_n: 32
  checkpoints: [8, 16, 32, 64]
  temperature: 1.0
  generation_batch_size: 8
  expected_batch_size: 1
  policy: full_vocabulary_top_k_0_top_p_1_first_N_valid_lines
monte_carlo:
  block_sizes: [8, 16, 32, 64]
  blocks: consecutive_disjoint_accepted_sample_indices
  standard_deviation_ddof: 1
  paired_differences: Same block indices in original and variant, variant minus original.
  n64_block_sd: null  # Only one block; unknown, not zero.
  primary_point_estimate: first_32_accepted_samples
  note: Block SD estimates variability of an N-sample score; do not divide it by sqrt(number_of_blocks).
future_evaluation:
  preserve_essay_id_across_conditions: true
  same_seed_for_original_and_all_revisions: true
  change_primary_metric_requires_user_approval: true
  approved_policy: configs/evaluation_policy.yaml
  approved_role: auxiliary
  approved_method: integer_mean
  approved_n: 64
  record_greedy: true
  selection_timing: user_approved_after_stage1_5_results
