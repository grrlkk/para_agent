[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "para-agent"
version = "0.0.0"
description = "Paragraph-level writing experiment with local diagnosis and structured LLM revision"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.11,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "anthropic>=1,<2", "numpy>=2,<3", "scipy>=1.15,<2"]
live = ["openai>=2.44,<3", "anthropic>=1,<2"]
eval = ["numpy>=2,<3", "scipy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

